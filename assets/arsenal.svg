<text class="mono" x="74" y="62" font-size="16" font-weight="600" fill="#F2F2F0">python</text>
<text class="sans" x="328" y="62" font-size="14" fill="#A9ABAE">scrapers, data pipelines, the API build</text>
<line x1="28" y1="82" x2="1172" y2="82" stroke="#1D1F22" stroke-width="1"/>
