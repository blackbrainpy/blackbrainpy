<text class="mono" x="74" y="114" font-size="16" font-weight="600" fill="#F2F2F0">javascript</text>
<text class="sans" x="328" y="114" font-size="14" fill="#A9ABAE">site logic, interactive explainers</text>
<line x1="28" y1="134" x2="1172" y2="134" stroke="#1D1F22" stroke-width="1"/>
