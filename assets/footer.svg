<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="subscribe">
<defs>
<style>
.mono{font-family:'IBM Plex Mono','SF Mono','Consolas','DejaVu Sans Mono',monospace}
.sans{font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif}
.disp{font-family:'IBM Plex Mono','SF Mono','Consolas','DejaVu Sans Mono',monospace;font-weight:600;letter-spacing:-0.03em;fill:#F2F2F0}
.sec{font-family:'IBM Plex Mono','SF Mono','Consolas','DejaVu Sans Mono',monospace;font-weight:600;font-size:22px;letter-spacing:-0.02em;fill:#F2F2F0}
.kick{font-family:'IBM Plex Mono','SF Mono','Consolas','DejaVu Sans Mono',monospace;font-weight:600;font-size:11px;letter-spacing:0.18em;fill:#FF4D00}
.lab{font-family:'IBM Plex Mono','SF Mono','Consolas','DejaVu Sans Mono',monospace;font-weight:600;font-size:11px;letter-spacing:0.16em;fill:#7D8084}
.meta{font-family:'IBM Plex Mono','SF Mono','Consolas','DejaVu Sans Mono',monospace;font-weight:500;font-size:11px;letter-spacing:0.07em;fill:#7D8084}
.dek{font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:15px;fill:#A9ABAE}
.hl{font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:500;font-size:19px;fill:#E7E7E5}
.idx{font-family:'IBM Plex Mono','SF Mono','Consolas','DejaVu Sans Mono',monospace;font-weight:600;font-size:13px;fill:#FF4D00}
.val{font-family:'IBM Plex Mono','SF Mono','Consolas','DejaVu Sans Mono',monospace;font-weight:600;font-size:34px;fill:#F2F2F0}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
.cur{animation:blink 1.1s steps(1) infinite}
</style>
<pattern id="stripe" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
<rect width="34" height="34" fill="#101216"/><rect width="14" height="34" fill="#ffffff" opacity="0.04"/>
</pattern>
</defs>
<rect width="1200" height="260" fill="#0A0B0C"/>
<rect x="0" y="0" width="1200" height="2" fill="#FF4D00"/>
<rect x="28" y="24" width="1144" height="150" fill="#0E0F11" stroke="#1D1F22" stroke-width="1" rx="5"/>
<text class="lab" x="56" y="60" fill="#6B6E72">// newsletter</text>
<text class="sec" x="56" y="98" font-size="30"><tspan fill="#FF4D00">$ </tspan>subscribe --weekly</text>
<text class="sans" x="56" y="126" font-size="15" fill="#A9ABAE">the tech that actually mattered this week. no hype, no filler.</text>
<rect x="832" y="86" width="300" height="40" fill="none" stroke="#26282B" stroke-width="1" rx="3"/>
<text class="mono" x="850" y="112" font-size="13" fill="#6B6E72"><tspan fill="#FF4D00">&#8594; </tspan>genztech.blog</text>
<text class="meta" x="56" y="152" fill="#6B6E72">// built on the internet &#183; ships daily</text>
<line x1="28" y1="206" x2="1172" y2="206" stroke="#1D1F22" stroke-width="1"/>
<text class="mono" x="28" y="240" font-weight="600" font-size="16" letter-spacing="-0.02em"><tspan fill="#F2F2F0">&lt;genz</tspan><tspan fill="#FF4D00">/</tspan><tspan fill="#F2F2F0">&gt;</tspan><tspan fill="#8A8D91">tech</tspan></text>
<text class="meta" x="1172" y="240" text-anchor="end" fill="#6B6E72">&#169; 2026 GENZ TECH &#183; // status: all systems operational</text>
</svg>
