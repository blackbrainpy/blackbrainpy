<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 182 40" width="182" height="40" role="img" aria-label="info@genztech.blog">
<defs>
<style>
.mono{font-family:'IBM Plex Mono','SF Mono','Consolas','DejaVu Sans Mono',monospace}
