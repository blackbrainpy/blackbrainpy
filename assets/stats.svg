</g>
<g transform="translate(452,92)">
<rect x="0" y="-34" width="3" height="52" fill="#26282B"/>
<text class="big" x="18" y="0">3</text>
<text class="m" x="20" y="20" fill="#7D8084">PULL REQUESTS</text>
</g>
<g transform="translate(842,92)">
<rect x="0" y="-34" width="3" height="52" fill="#26282B"/>
<text class="big" x="18" y="0">0</text>
<text class="m" x="20" y="20" fill="#7D8084">ISSUES</text>
</g>
<g transform="translate(62,200)">
<rect x="0" y="-34" width="3" height="52" fill="#26282B"/>
<text class="big" x="18" y="0">3</text>
<text class="m" x="20" y="20" fill="#7D8084">STARS EARNED</text>
</g>
<g transform="translate(452,200)">
<rect x="0" y="-34" width="3" height="52" fill="#26282B"/>
