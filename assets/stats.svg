<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Data streams">
<defs>
<style>
.hd{font-family:'IBM Plex Mono','SF Mono','Consolas',monospace;font-weight:600;font-size:17px;letter-spacing:-0.01em;fill:#F2F2F0}
.big{font-family:'IBM Plex Mono','SF Mono','Consolas',monospace;font-weight:600;font-size:34px;fill:#F2F2F0}
.m{font-family:'IBM Plex Mono','SF Mono','Consolas','DejaVu Sans Mono',monospace;font-weight:500;font-size:11px;letter-spacing:0.07em}
.v{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-size:14px;fill:#A9ABAE}
@keyframes dr{0%{stroke-dashoffset:2600}100%{stroke-dashoffset:0}}
@keyframes fi{0%{opacity:0}100%{opacity:.22}}
.ln{stroke-dasharray:2600;animation:dr 2.6s ease-out forwards}
.ar{animation:fi 2.6s ease-out forwards;opacity:0}
</style>
<linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FF4D00" stop-opacity="0.42"/>
<stop offset="1" stop-color="#FF4D00" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="330" fill="#0A0B0C"/>
<rect x="0" y="0" width="1200" height="2" fill="#FF4D00"/>
