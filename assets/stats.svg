<text class="m" x="180" y="0" fill="#F2F2F0">2 DAYS</text>
<text class="m" x="330" y="0" fill="#7D8084">LONGEST STREAK</text>
<text class="m" x="520" y="0" fill="#F2F2F0">2 DAYS</text>
