<text class="m" x="1172" y="42" fill="#7D8084" text-anchor="end">25 CONTRIBUTIONS</text>
<line x1="28" y1="60" x2="1172" y2="60" stroke="#1D1F22" stroke-width="1"/>
<g transform="translate(62,92)">
